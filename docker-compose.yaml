services:
  orca-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orca_agentic_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./temp:/app/temp
    restart: unless-stopped
    # For local dev hot-reload, uncomment:
    # volumes:
    #   - ./app:/app/app
    # command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload